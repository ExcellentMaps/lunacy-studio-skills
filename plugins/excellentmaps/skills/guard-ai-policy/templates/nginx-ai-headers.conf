# ═══════════════════════════════════════════════════════════════════════
# Заголовки ИИ-политики — добавить внутрь вашего server{} блока
# Guard Security Suite © ExcellentMaps — github.com/ExcellentMaps
#
# Заголовок надёжнее мета-тега: он действует на ВСЕ файлы —
# картинки, PDF, выгрузки, — у которых нет HTML-разметки.
# ═══════════════════════════════════════════════════════════════════════

# Запрет индексации, архивирования и обучения. Для закрытой системы.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;

# Заявление о статусе доступа — видно в любом ответе сервера.
add_header X-Access-Policy "private; authorized-users-only; see /llms.txt" always;

# Файлы политики должны отдаваться всегда и с правильным типом.
location = /llms.txt {
    default_type text/plain;
    charset utf-8;
    add_header X-Robots-Tag "noindex" always;
}

location = /robots.txt {
    default_type text/plain;
    charset utf-8;
}

location = /.well-known/ai.txt {
    default_type text/plain;
    charset utf-8;
}

location = /.well-known/security.txt {
    default_type text/plain;
    charset utf-8;
}

location = /.well-known/tdmrep.json {
    default_type application/json;
    charset utf-8;
}
