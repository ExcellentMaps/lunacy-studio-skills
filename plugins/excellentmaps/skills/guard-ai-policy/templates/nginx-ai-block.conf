# ═══════════════════════════════════════════════════════════════════════
# Блокировка ИИ-ботов, скраперов и сканеров — nginx
# Guard Security Suite © ExcellentMaps — github.com/ExcellentMaps
#
# КУДА КЛАСТЬ: /etc/nginx/conf.d/ai-block.conf
#   (директива map работает только на уровне http, поэтому именно conf.d,
#    а не внутрь server{} — иначе nginx не запустится)
#
# КАК ВКЛЮЧИТЬ: в вашем server{} добавить
#   if ($guard_deny_bot) { return 403; }
#
# ⚠️ ПЕРЕД ВКЛЮЧЕНИЕМ ПРОВЕРЬТЕ ТРИ ВЕЩИ:
#   1. Ваши вебхуки (платежи, мессенджеры, телефония) внесены в исключения ниже,
#      иначе они молча перестанут приходить.
#   2. Путь /.well-known/acme-challenge/ исключён — иначе через 90 дней
#      не продлится SSL-сертификат.
#   3. Если сайт должен быть в поиске — закомментируйте группу «Поисковики».
#
# ПРОВЕРКА ПОСЛЕ ВКЛЮЧЕНИЯ:
#   nginx -t && systemctl reload nginx
#   curl -A "GPTBot" -o /dev/null -w "%{http_code}\n" https://ВАШ_ДОМЕН/      → 403
#   curl -A "Mozilla/5.0" -o /dev/null -w "%{http_code}\n" https://ВАШ_ДОМЕН/ → 200
# ═══════════════════════════════════════════════════════════════════════

map $http_user_agent $guard_blocked_ua {
    default 0;

    # ── Группа 1. ИИ-краулеры: обучение моделей и сбор данных ──────────
    "~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|Claude-SearchBot|anthropic-ai)" 1;
    "~*(PerplexityBot|Perplexity-User|Google-Extended|GoogleOther|Applebot-Extended)"           1;
    "~*(CCBot|Bytespider|Amazonbot|Diffbot|ImagesiftBot|Omgili|Timpibot|YouBot|cohere-ai)"      1;
    "~*(FacebookBot|Meta-ExternalAgent|Meta-ExternalFetcher|MistralAI-User|AI2Bot)"             1;

    # ── Группа 2. Поисковики ───────────────────────────────────────────
    # Для CRM и админок — блокируем: индексировать там нечего.
    # Для публичного сайта — ЗАКОММЕНТИРУЙТЕ эти две строки!
    "~*(Googlebot|Google-InspectionTool|Bingbot|BingPreview|Applebot)"    1;
    "~*(YandexBot|Yandex|DuckDuckBot|Baiduspider|Sogou|Slurp)"            1;

    # ── Группа 3. Сканеры уязвимостей ──────────────────────────────────
    # Блокируем всегда. Ни один из них не является вашим инструментом,
    # если вы не запускали его сами и не знаете об этом.
    "~*(nmap|nikto|sqlmap|masscan|nuclei|acunetix|nessus|openvas|wpscan)" 1;
    "~*(zgrab|censys|shodan|zmap|dirbuster|gobuster|feroxbuster|ffuf)"    1;

    # ── Группа 4. SEO-краулеры ─────────────────────────────────────────
    "~*(semrush|ahrefs|mj12bot|dotbot|petalbot|dataforseobot|blexbot)"    1;

    # ── Группа 5. Простые HTTP-клиенты ─────────────────────────────────
    # ⚠️ ОСТОРОЖНО: сюда попадают ваш мониторинг аптайма и ваши же
    # серверные скрипты. Если что-то внешнее ходит на сайт через curl —
    # закомментируйте эту группу или внесите исключение по IP ниже.
    "~*(python-requests|python-urllib|aiohttp|httpx|scrapy|go-http-client)" 1;
    "~*(curl|wget|libwww|java/|okhttp|apache-httpclient|node-fetch|axios)"  1;

    # ── Группа 6. Пустой User-Agent ────────────────────────────────────
    # Живой браузер всегда представляется. Пустая строка — автоматика.
    ""      1;
    "-"     1;
}

# ── ИСКЛЮЧЕНИЯ ПО ПУТИ ────────────────────────────────────────────────
# Адреса, на которые блокировка НЕ распространяется.
# ДОБАВЬТЕ СЮДА СВОИ ВЕБХУКИ — иначе интеграции перестанут работать.
map $uri $guard_allow_uri {
    default 0;
    "~^/\.well-known/acme-challenge/"  1;   # продление SSL — не трогать
    "~^/\.well-known/"                 1;   # security.txt, ai.txt и прочее
    "~^/api/webhook/"                  1;   # ← ЗАМЕНИТЕ на свои пути вебхуков
    # "~^/wazzup-hook/"                1;   # пример: вебхук мессенджера
    # "~^/payment/callback/"           1;   # пример: подтверждение оплаты
    # "~^/health$"                     1;   # пример: проверка мониторингом
}

# ── ИСКЛЮЧЕНИЯ ПО IP ──────────────────────────────────────────────────
# Свой офис, свой мониторинг, свои серверы.
map $remote_addr $guard_allow_ip {
    default 0;
    # "203.0.113.7"   1;   # ← пример: IP офиса
    # "198.51.100.42" 1;   # ← пример: сервер мониторинга
}

# ── ИТОГОВОЕ РЕШЕНИЕ ──────────────────────────────────────────────────
# Блокируем, только если UA в списке И путь не исключён И IP не исключён.
map "$guard_blocked_ua$guard_allow_uri$guard_allow_ip" $guard_deny_bot {
    default 0;
    "100"   1;
}
