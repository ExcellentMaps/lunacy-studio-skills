# ═══════════════════════════════════════════════════════════════════════
# Боевой конфиг nginx для сайта с HTTPS
# Guard Security Suite © ExcellentMaps — github.com/ExcellentMaps
#
# КУДА КЛАСТЬ: /etc/nginx/sites-available/ВАШ_ДОМЕН
#   и включить ссылкой: ln -s /etc/nginx/sites-available/ВАШ_ДОМЕН \
#                             /etc/nginx/sites-enabled/ВАШ_ДОМЕН
#   Зоны limit_req_zone ниже объявлены на уровне http — положите их
#   в /etc/nginx/conf.d/limits.conf, а не внутрь server{}, иначе nginx
#   не запустится.
#
# ⚠️ ЧТО ЗАМЕНИТЬ ПЕРЕД ПРИМЕНЕНИЕМ:
#   1. ВАШ_ДОМЕН            — везде, включая пути к сертификату
#   2. /var/www/site        — каталог собранного фронтенда
#   3. /var/www/files       — каталог пользовательских файлов (или убрать блок)
#   4. 127.0.0.1:8000       — адрес вашего бэкенда
#   5. /api/auth/login      — реальный путь страницы входа
#   6. CSP ниже             — домены ваших виджетов, карт, счётчиков
#   7. Цифры в limit_req    — по реальной нагрузке, см. references/rate-limits.md
#
# ⚠️ CSP ВКЛЮЧАТЬ НЕ СРАЗУ. Сначала переименуйте заголовок в
#   Content-Security-Policy-Report-Only, обойдите все разделы сайта с
#   открытой консолью браузера, почините нарушения — и только потом
#   верните боевое имя. Подробно: references/headers-and-csp.md
#
# КАК ПРОВЕРИТЬ:
#   sudo nginx -t                        # синтаксис
#   sudo systemctl reload nginx          # применить, живые соединения не рвутся
#   bash audit-live.sh ВАШ_ДОМЕН         # проверка снаружи (guard-audit/scripts)
#
# КАК ОТКАТИТЬ:
#   sudo cp /etc/nginx/sites-available/ВАШ_ДОМЕН.bak \
#           /etc/nginx/sites-available/ВАШ_ДОМЕН
#   sudo nginx -t && sudo systemctl reload nginx
#   (копию .bak сделайте ДО правки)
# ═══════════════════════════════════════════════════════════════════════


# ── ЗОНЫ ОГРАНИЧЕНИЯ ЧАСТОТЫ ──────────────────────────────────────────
# Объявляются один раз на уровне http. $binary_remote_addr — считаем
# по каждому адресу отдельно; 10m памяти хватает примерно на 160 тысяч
# адресов одновременно.

# Общая зона: 10 запросов в секунду с адреса. Живая работа столько
# не даёт, автоматика упирается сразу.
limit_req_zone $binary_remote_addr zone=guard_common:10m rate=10r/s;

# Строгая зона для страницы входа: 10 запросов в МИНУТУ с адреса.
# Человек, дважды ошибшийся паролем, в этот лимит не упирается,
# перебор паролей — упирается с первой секунды.
limit_req_zone $binary_remote_addr zone=guard_login:10m rate=10r/m;

# Одновременные соединения — против забивания сервера параллельными
# закачками с одного адреса.
limit_conn_zone $binary_remote_addr zone=guard_conn:10m;


# ── ПОРТ 80: ТОЛЬКО ПЕРЕНАПРАВЛЕНИЕ ───────────────────────────────────
# На 80 порту не должно остаться рабочей копии сайта: иначе форма входа
# будет доступна без шифрования, и часть людей пойдёт именно туда.
server {
    listen 80;
    listen [::]:80;
    server_name ВАШ_ДОМЕН;

    # Проверка владения доменом при выпуске и продлении сертификата.
    # ⚠️ Этот блок должен стоять ВЫШЕ запрета скрытых файлов, иначе
    # через 90 дней сертификат молча не продлится.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — на https, с сохранением адреса страницы.
    location / {
        return 301 https://$host$request_uri;
    }
}


# ── ОСНОВНОЙ СЕРВЕР: HTTPS ────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Отдельная директива http2 — nginx 1.25 и новее. На более старых
    # версиях уберите эту строку и пишите: listen 443 ssl http2;
    http2 on;
    server_name ВАШ_ДОМЕН;

    root /var/www/site;
    index index.html;

    # Не сообщать версию nginx: версия — это подсказка сканеру,
    # под какой готовый эксплойт браться. Останется "Server: nginx".
    server_tokens off;

    # Предел размера загружаемого файла. Заодно отсекает попытки
    # завалить диск одним запросом.
    client_max_body_size 32m;

    # ── СЕРТИФИКАТ ────────────────────────────────────────────────────
    # Пути live/… — это ссылки, которые certbot переключает при
    # продлении. Копировать файлы куда-то ещё нельзя: копия не обновится.
    ssl_certificate     /etc/letsencrypt/live/ВАШ_ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ВАШ_ДОМЕН/privkey.pem;

    # Только современные версии протокола. TLSv1.0 и 1.1 давно
    # отключены в браузерах — включать их «для совместимости» не нужно.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:guard_ssl:10m;
    ssl_session_timeout 1d;

    # ── ЗАГОЛОВКИ БЕЗОПАСНОСТИ ────────────────────────────────────────
    # always в конце обязательно: без него заголовок не попадёт
    # в ответы с кодами ошибок — то есть туда, где он нужнее всего.
    #
    # ⚠️ add_header внутри location ОТМЕНЯЕТ все add_header уровня
    # server — не дополняет, а заменяет целиком. Поэтому в каждом
    # location ниже заголовки перечислены заново.

    # Браузер запоминает: на этот сайт — только по защищённому
    # соединению. ⚠️ Начинайте с max-age=300 и наращивайте только
    # после того, как certbot renew --dry-run проходит успешно:
    # откатить большой max-age быстро невозможно.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Браузер не угадывает тип файла по содержимому. Загруженная
    # «картинка» с кодом внутри не выполнится как скрипт.
    add_header X-Content-Type-Options "nosniff" always;

    # Чужие сайты не узнают адрес страницы, с которой к ним пришли —
    # в адресах бывают номера заказов и идентификаторы клиентов.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Страница не может запросить камеру, микрофон и геолокацию.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Сайт нельзя встроить в чужую страницу (защита от подмены
    # интерфейса поверх вашего). Дублируется в CSP как frame-ancestors.
    add_header X-Frame-Options "DENY" always;

    # ── CSP ───────────────────────────────────────────────────────────
    # ⚠️ ЗАМЕНИТЕ https://ВАШ_ВИДЖЕТ.ru на реальные домены чата, карт,
    # счётчика — или уберите их, если ничего стороннего нет.
    # ⚠️ Для первого включения переименуйте заголовок в
    # Content-Security-Policy-Report-Only.
    #
    #   default-src 'self'      всё по умолчанию — только свой домен
    #   script-src  'self'      код только свой. Главная строка политики:
    #                           не добавляйте сюда 'unsafe-inline'
    #   style-src   unsafe-inline  уступка сборщикам фронтенда; это про
    #                           оформление, а не про код — приемлемо
    #   img-src     data: blob: картинки, встроенные в страницу и
    #                           созданные ей самой (превью, печать)
    #   connect-src             куда странице разрешено слать запросы
    #   frame-ancestors 'none'  вашу страницу не встроить никуда
    #   base-uri    'self'      нельзя подменить базовый адрес и увести
    #                           загрузку всех скриптов на чужой сервер
    #   form-action 'self'      формы уходят только на ваш сервер
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://ВАШ_ВИДЖЕТ.ru; font-src 'self' data:; connect-src 'self' https://ВАШ_ВИДЖЕТ.ru; worker-src 'self' blob:; manifest-src 'self'; frame-src https://ВАШ_ВИДЖЕТ.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Если бэкенд представляется — убрать эту подсказку.
    proxy_hide_header X-Powered-By;

    # ── СЖАТИЕ ────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml font/woff font/woff2;

    # ── ПРОДЛЕНИЕ СЕРТИФИКАТА ─────────────────────────────────────────
    # ⚠️ Выше запрета скрытых файлов — иначе правило ниже закроет и этот
    # путь, и продление перестанет работать через 90 дней.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── ЗАПРЕТ СЛУЖЕБНЫХ И СКРЫТЫХ ФАЙЛОВ ─────────────────────────────
    # Закрывает .env, .git/, .htaccess, .DS_Store одним правилом.
    # Открытый .env — все ключи по прямой ссылке; открытый .git/ —
    # весь исходный код вместе с историей.
    # Это вторая линия: сами файлы должны лежать ВНЕ /var/www/site.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # То же для файлов, которые иногда случайно попадают в сборку.
    location ~* \.(sql|bak|log|ini|conf|yml|yaml|sh)$ {
        deny all;
        access_log off;
    }

    # ── БЭКЕНД ────────────────────────────────────────────────────────
    # Бэкенд слушает 127.0.0.1 и снаружи недоступен вообще —
    # единственный путь к нему идёт через этот блок.
    location /api/ {
        # burst=20 — короткий всплеск (открытие раздела шлёт несколько
        # запросов сразу) проходит; nodelay — без искусственной задержки,
        # иначе интерфейс начнёт заметно подтормаживать.
        limit_req zone=guard_common burst=20 nodelay;
        # 429 = «слишком много запросов». Код по умолчанию 503 означает
        # «сервис недоступен» — его мониторинг посчитает аварией.
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── СТРАНИЦА ВХОДА: СТРОГИЙ ЛИМИТ ─────────────────────────────────
    # ⚠️ Точный путь (location =), а не каталог: строгий лимит,
    # случайно накрывший весь /api/, сделает интерфейс неработоспособным.
    location = /api/auth/login {
        limit_req zone=guard_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── СТАТИКА С КЕШЕМ ───────────────────────────────────────────────
    # Файлы сборки с хешем в имени: при изменении меняется имя,
    # поэтому их можно кешировать надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Служебный скрипт офлайн-режима кешировать нельзя: иначе
    # у пользователей останется старая версия приложения.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── ПОЛЬЗОВАТЕЛЬСКИЕ ФАЙЛЫ ────────────────────────────────────────
    # Content-Disposition: attachment — файл всегда скачивается, а не
    # открывается в браузере. Загруженный кем-то HTML или SVG со
    # скриптом внутри не выполнится на вашем домене.
    location /files/ {
        alias /var/www/files/;
        limit_conn guard_conn 10;      # не больше 10 закачек с адреса
        limit_conn_status 429;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ── SPA-FALLBACK ──────────────────────────────────────────────────
    # Одностраничное приложение: маршрутов на диске нет, любой адрес
    # отдаёт index.html, дальше разбирается сам фронтенд.
    # ⚠️ Стоит последним: правила выше должны отработать раньше.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
